server {
    listen 80;
    listen [::]:80;
    server_name chrust.org www.chrust.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/chrust.org/acme;
    }

    location / {
        return 301 https://chrust.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chrust.org www.chrust.org;

    ssl_certificate /etc/letsencrypt/live/chrust.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chrust.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/chrust.org/current;
    index index.html;

    access_log /var/log/nginx/chrust.org.access.log;
    error_log /var/log/nginx/chrust.org.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
