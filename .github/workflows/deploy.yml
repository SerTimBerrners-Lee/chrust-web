name: Deploy chrust.org

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrust-org-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://chrust.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          lfs: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Build and check the complete static site
        run: |
          bun run build
          bun run test
          python3 -m unittest discover -s ops -p 'test_*.py' -v

      - name: Publish an atomic release
        env:
          DEPLOY_KEY: ${{ secrets.CHRUST_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -czf "$RUNNER_TEMP/chrust-site.tar.gz" -C dist .
          ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=ops/known_hosts \
            -o ConnectTimeout=15 \
            chrust-web-deploy@212.119.42.46 "$release" \
            < "$RUNNER_TEMP/chrust-site.tar.gz"

      - name: Verify the served revision
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 20 \
            --resolve chrust.org:80:212.119.42.46 \
            --resolve chrust.org:443:212.119.42.46 \
            http://chrust.org/version.json > "$RUNNER_TEMP/chrust-version.json"
          jq -e --arg revision "$GITHUB_SHA" '.revision == $revision' \
            "$RUNNER_TEMP/chrust-version.json"
