server {
    listen 80;
    listen [::]:80;
    server_name chrust.org www.chrust.org;

    root /var/www/chrust.org/current;
    index index.html;

    access_log /var/log/nginx/chrust.org.access.log;
    error_log /var/log/nginx/chrust.org.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/chrust.org/acme;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
